apiVersion: v1
kind: Service
metadata:
  name: {{ include "seeker.fullname" . }}
  labels:
    {{- include "seeker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: {{ include "seeker.name" . }}
